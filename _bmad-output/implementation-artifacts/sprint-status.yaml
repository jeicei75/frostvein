    epic_3_outcome: "READ THIS BEFORE TRUSTING THE `done` ABOVE. The rule was encoded and the rule was WRONG, and this row said `done` for the whole of Epic 3 while it cost coverage on two of three stories. It kills on wall-clock-since-launch; the four layers run concurrently, each is MANDATED to run cargo test, and they starve on one target/ lock -- a lock-blocked layer emits nothing, which the rule cannot distinguish from a hang. 3.1: three of four layers killed with ZERO findings between them, and the epic's most severe defect (a whole-world designate taking a delta from 378 bytes to 16,761,209 bytes at 34.7 MB/s, world simultaneously unsaveable) was found by the orchestrator INLINE after all three had failed; one of the killed layers was literally reporting the cause (`sequential due to target lock`). 3.3: three killed in round one, and the Edge Case Hunter died silent AGAIN on the re-run, so that story's loader/boundary territory is UNREVIEWED by any layer. 3.2, the one story where all four completed, is also the story where review found the most. The Epic 2 retro DIAGNOSED this exactly -- measure silence-since-last-named-step, stop combining mandatory live execution with concurrent layers sharing a build lock -- and wrote it into no config file, which is the identical meta-failure this item was created to fix. THE FIX IS NOW Epic 3 items P1 (silence-based detector) and P2 (per-layer CARGO_TARGET_DIR). STANDING LESSON, now a team agreement: `encoded` and `correct` are different claims and a follow-through table cannot tell them apart"
