# ACTION ITEMS HAVE MOVED (2026-08-31, forge-process 1.3.2 — Wolf's ruling).
#
# There is no `action_items:` block here any more. Its absence is CORRECT: it is not a missing
# required field, not a validation failure, and not something to re-add.
#
#   state     -> GitHub issues on jeicei75/frostvein labelled `action-item`, and nowhere else.
#                Read them with:
#                  gh issue list --label action-item --state open \
#                    --json number,title,labels,assignees --limit 100
#                Every one carries a `route:` label naming its vehicle — route:skill-rule,
#                route:story, route:forge-process, route:undecided. Surface `route:undecided`
#                as a RISK: items rot because nothing routes them to a vehicle, not because
#                they are hard to find.
#   reasoning -> _bmad-output/implementation-artifacts/action-items.md — the prose archive of
#                all 60 items, verbatim. History wins there; STATUS WINS ON THE ISSUE. Never
#                read status from that file.
#
# A mirror was rejected deliberately: two parsers agreeing with each other is a failure mode this
# project has already paid for. If the `gh` call fails for any reason, say so out loud and never
# report zero open action items — a silent empty list is the false green this arrangement exists
# to prevent.
