[workspace]
resolver = "3"
members = [
    "crates/sim-core",
    "crates/protocol",
    "crates/simd",
    "crates/tui",
    "crates/client-core",
    "crates/gui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
bevy_ecs = "0.19.0"
# Bevy is the story 5.3 renderer.  Its explicit feature trim avoids the devpods'
# unavailable Wayland, audio, gamepad, and system-library dependencies.
bevy = { version = "0.19.0", default-features = false, features = [
    "std", "default_app", "3d_bevy_render", "ui_api", "ui_bevy_render",
    "default_font", "bevy_winit", "multi_threaded", "x11", "bevy_dev_tools",
] }
crossterm = "0.29.0"
rand = "0.10.2"
rand_chacha = { version = "0.10.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
