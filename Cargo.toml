[workspace]
resolver = "3"
members = [
    "crates/sim-core",
    "crates/protocol",
    "crates/simd",
    "crates/tui",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
bevy_ecs = "0.19.0"
crossterm = "0.29.0"
rand = "0.10.2"
rand_chacha = { version = "0.10.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
