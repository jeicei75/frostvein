# frostvein overrides for bmad-code-review — Feature Auditor layer + metric + approval-gated publish.

[workflow]
persistent_facts = [
  "FOURTH REVIEW LAYER \u2014 Feature Auditor (\\\"does it do the thing?\\\"). In step 2, alongside Blind Hunter / Edge Case Hunter / Acceptance Auditor, ALWAYS run a Feature Auditor over the same diff + spec. Origin: on a sibling forge project, three adversarial layers found real data-loss defects and NONE noticed the feature did not work at all \u2014 the capability existed, was tested, and was never invoked; only the live run caught it, twice in two epics. All adversarial layers hunt for WRONG code; this one asks whether the RIGHT code is present. Method: (1) name the story's headline user-visible outcome in one sentence, in the user's words; (2) trace the ACTUAL end-to-end path that produces it \u2014 entry point -> each hop -> observable result \u2014 from real source, not the diff; (3) at every hop ask what INVOKES the next step: a capability that exists but is never called is THE defect this layer exists to catch; (4) flag what only a human running it would discover (a function registered but never instructed, a config the deployment never sets, a branch reachable only from tests); (5) state which ACs CANNOT be verified without actually running it (for frostvein: the scenario test or visible TUI behavior every story must end with) and say so rather than inferring them green. Output per hop: WIRED (cite the caller) or NOT WIRED (what is missing). A green suite is NOT evidence for this layer.",
  "REVIEW LAYER CONFIGURATION -- SETTLED by Wolf on 2026-08-03 at story 2.2's review; do NOT re-ask it. Lever A is resolved: KEEP Blind Hunter + Edge Case Hunter on Sonnet; Acceptance Auditor, Feature Auditor and triage stay Opus. The binding addition: EVERY layer MUST RUN THE BINARIES, not merely read the diff. Each layer's prompt must carry the toolchain export (export PATH=\"/home/vscode/.local/share/mise/installs/rust/1.97.1/bin:$PATH\" -- cargo is NOT on the agent PATH), the `cargo test --offline -p <crate>` commands, and the live instruments (`cargo run -p simd`, `cargo run -p tui -- --frames 30`), plus instructions to put scratch work in /tmp, never modify a tracked file, and kill any daemon it starts. Rationale: across 1.3 and 2.1 model tier never discriminated -- the Sonnet hunters produced no unique finding and cost stayed flat -- while every finding of substance came from layers that executed code. Model tier is no longer the experiment; live execution is the standard. If a future retro revisits this, the control is still mutation kill-rate against 1.3's baseline. Practical note: the layers run concurrently, so tell each one that cargo serializes on the target/ lock and the daemon's fixed port may be briefly held by a sibling agent -- neither is a defect.",
  "REVIEW FRAMING \u2014 unit-green is never feature-proof on this project. When reporting the outcome, state plainly what has and has NOT been proven by actually running it (the scenario test / TUI behavior the story promises), and never let passing gates imply the feature works end to end. An observable-outcome AC stays OPEN until it has actually been observed; say so in the summary rather than burying it.",
  "LAYER TIME-BOX -- MANDATORY, enforced by the orchestrator (Epic 2 retrospective, 2026-08-05; origin: story 2.4, where a hunter layer hung for ~2.5 HOURS and the run was only rescued when Wolf came back and noticed). Every review layer gets a HARD wall-clock budget of 20 MINUTES. You (the orchestrator) enforce it: when a layer exceeds its budget, KILL it, record it as TIMED OUT in the triage, and continue with the layers that finished -- never sit waiting on it, and never extend the budget because it \"seems close\". A timed-out layer is a HOLE IN COVERAGE, not a clean result: say so explicitly in the review summary (\"Edge Case Hunter timed out at 20 min; its territory is unreviewed\") so its silence can never be read as \"found nothing\". Re-run a timed-out layer once, with its scope narrowed, only if Wolf asks. CRITICAL, this is what made 2.4 hard to spot: A GROWING TRANSCRIPT IS NOT PROGRESS. A hung layer keeps emitting tokens and its log keeps growing, so file size, token count and \"still running\" all look identical to healthy work. The only progress signals that count are a layer completing a NAMED step of its method or emitting a finding; if neither has advanced within the budget, it is hung. Also budget the whole review: if total review wall-clock passes 60 MINUTES, stop, report what you have, and ask Wolf before continuing -- an unattended review must degrade into a partial report, never into an open-ended wait.",
]
on_complete = "Two steps, in order. STEP A (METRIC): record this review session's token cost \u2014 always yours: `python3 {project-root}/_bmad/scripts/session_tokens.py --phase review --story <STORY_KEY>`; show the breakdown and `est. cost`. (Post-review patches applied in a SEPARATE later session are recorded there with `--phase review-patch`.) STEP B (APPROVAL-GATED PUBLISH): after findings are triaged and patches handled per Wolf's choice: (1) summarize the review outcome and ASK Wolf whether to push and open the PR. (2) ONLY on his explicit yes: confirm cwd/remote = this repo (jeicei75/frostvein), push the feature branch, `gh pr create --base main` with a concise body. NOTE: the gh token may be scoped to Asgard-realm repos \u2014 if PR creation fails on auth, report it and give Wolf the compare URL instead; the push having succeeded is fine. (3) Wolf merges himself \u2014 NEVER merge, NEVER push without his explicit yes."
