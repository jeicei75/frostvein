# frostvein overrides for bmad-code-review — Feature Auditor layer + metric + approval-gated publish.
# Reconciled with forge-process 1.1.0 on 2026-08-08. Frostvein-only facts: REVIEW LAYER
# CONFIGURATION (mandated live execution + build isolation) and LAYER TERRITORIES, both
# deliberately not upstream. REVIEW FRAMING is the frostvein-adapted wording.

[workflow]
persistent_facts = [
  "REVIEW-COST DISCIPLINE -- taken from the forge 2026-08-06 (its ep-11 retro A3), adapted to frostvein rather than copied. Review is this project's largest single cost. The old '~$22/story is the settled floor' figure is FALSIFIED -- Epic 3 measured $45.52/story over 862 turns, a 73% rise, and review is 57% of Claude spend only because dev got more expensive. Every ledger figure before 2026-08-08 is additionally a known UNDERCOUNT (it omitted sub-agent and nested-rollout fan-out), so quote no floor at all until a full epic is measured with fan-out accounting on. It is expensive because it RE-READS, not because it thinks -- 96% of every token processed was a cache read, in BOTH epics -- and cost is turns x accumulated context, so a long review session is roughly quadratic. TWO RULES here; fresh context and one-verification-pass moved to their own fact (REVIEW RUNS IN A FRESH CONTEXT), so they are stated once. (1) LABEL EVERY FINDING with its originating LAYER and a SEVERITY, in the triage, every time: HIGH (feature) / MED (edge+blind) / LOW (auditor). This is also the standing Epic 2 action item 'record which review layer raised each finding'. Convergence between layers was only visible at the Epic 2 retro because three layers happened to be named in two story files; the proposed R1 territory split rests entirely on this being MEASURED rather than inferred, and it is what makes 'which layer earns its keep?' answerable at the Epic 3 retro. Record a TIMED-OUT layer here too, as a coverage hole with zero findings -- never as a clean result (see LAYER TIME-BOX). (2) CAP THE LOW TAIL: a LOW finding goes STRAIGHT to _bmad-output/implementation-artifacts/deferred-work.md with its file:line -- no patch, no covering test, no re-gate. Patch only HIGH and MED, plus any LOW sitting in a function you are already editing. The LOW tail is what drives the most patch turns at the highest cost per turn. FROSTVEIN EXCEPTION, and it is not optional: a LOW that is a LATENT SILENT-FAILURE trap gets patched regardless of severity -- a wrong value that no test and no human will ever see (a broken observability instrument, a misreported error, a metric billed to the wrong transcript). This project has been bitten by that class repeatedly and Wolf has overridden 'defer it, YAGNI' every time it has come up. NOTE the R1 sentence above is now history, not a plan: the territory split WAS approved and lives in LAYER TERRITORIES.",
  "FOURTH REVIEW LAYER — Feature Auditor (\"does it do the thing?\"). In step 2, alongside Blind Hunter / Edge Case Hunter / Acceptance Auditor, ALWAYS run a Feature Auditor over the same diff + spec. Its question is NOT 'is this code wrong?' but 'if I ran this for real, would the user get the outcome the story promises?'. Method, in order: (1) Name the story's headline user-visible outcome in one sentence, in the user's words, not the ACs'. (2) Trace the ACTUAL end-to-end path that produces it — entry point → each hop → the observable result — naming the function at every hop from the real source, not the diff. (3) At every hop ask: what INVOKES the next step? A capability that exists but is never called is the defect this layer exists to catch — check that each new function/tool/handler has a real caller on the live path, not only a test. (4) Flag anything only a human running it would discover: a tool registered but never instructed, an instruction the model is never given, a config the deployment never sets, a branch reachable only in tests. (5) State explicitly which ACs CANNOT be verified without a live run (for frostvein: the scenario test or the visible TUI behaviour every story must end with), and say so rather than inferring them green from unit tests. Output: for each hop, WIRED (cite the caller) or NOT WIRED (say what is missing). A green suite is NOT evidence for this layer — on ep-11-us-03 every test passed while the feature did nothing.",
  "REVIEWS ARE READ-ONLY (ep-06 retro A6). No review layer — and no subagent a review layer spawns — may mutate the working tree or the repo state. Specifically FORBIDDEN during a review: `git checkout`/`switch`, `git reset`, `git stash`, `git clean`, `git restore`, branch or tag deletion, and deleting or moving any file, tracked or untracked. Read-only inspection is unrestricted: `git diff`, `git log`, `git show`, `git status`, reading any path. WHY: on ep-06-us-01 a review subagent checked out `main` mid-review and deleted untracked files — a review destroyed the very work it was sent to examine, and the loss was not the reviewer's to take. If a finding genuinely cannot be verified without a mutation (reproducing a build, applying a patch to test it), STOP and ASK Wolf first, naming the exact command; do not do it and report afterwards. The patch pass is a SEPARATE phase with its own session and its own approval — a review reports, it does not repair. FROSTVEIN CARVE-OUT, and it does not weaken the rule: this project MANDATES that every layer run the binaries (see REVIEW LAYER CONFIGURATION), so building, running `cargo test`, starting and killing a daemon, and writing scratch files under /tmp are all EXPECTED and are not mutations of repo state. Each layer builds into its own CARGO_TARGET_DIR under /tmp, so even the build output leaves the working tree untouched. What stays absolutely forbidden is unchanged and is the dangerous half: the git commands above, and modifying, moving or deleting ANY tracked or untracked file in the repo -- including `scripts/mutate.sh`, which rewrites source in place and must never run while layers are live, or they read mutated source and report fiction.",
  "LAYER TIME-BOX — KILL ON SILENCE, NOT ON ELAPSED TIME (ported from frostvein, Epic 3, 2026-08-08). A layer is stalled when it has produced no NEW NAMED METHOD STEP and no NEW FINDING for 8 minutes; hard ceiling 45 minutes per layer and 90 minutes for the whole review. TWO SUB-RULES THAT ARE EASY TO DROP AND WERE EXPENSIVE TO LEARN. (1) ASK BEFORE YOU KILL: message the layer 'your box is up — start nothing new, report what you have NOW', and terminate only if it stays silent after that. A bare kill returns NOTHING, which is the opposite of the rule's own purpose: an unattended review must degrade into a PARTIAL report, never an empty one. On frostvein's story 3.3 this salvaged the layer that produced the review's best findings. (2) A GROWING TRANSCRIPT IS NOT PROGRESS: a hung layer keeps emitting tokens, so file size, token count and 'still running' look identical to healthy work. The only signals that count are a named step completed or a finding emitted. WHY ELAPSED TIME IS THE WRONG TRIGGER: frostvein's first version fired on wall-clock and killed layers that were merely slow while missing ones that were genuinely stuck. THE COUPLING RULE, AND HERE IT IS LIVE: this time-box ships TOGETHER with per-layer BUILD ISOLATION (REVIEW LAYER CONFIGURATION) and neither may be shipped without the other. Frostvein is where the cause is real -- the layers execute `cargo` and four of them starve on one build lock, and a lock-starved layer emits nothing, which is indistinguishable from a hang. That is exactly how the previous wall-clock version killed three of four layers at story 3.1 and three of four at 3.3, leaving 3.3's loader and boundary territory unreviewed by any layer; at 3.1 one of the killed layers was literally reporting the cause (`sequential due to target lock`), and the epic's worst defect was then found by the orchestrator inline after all three hunters had failed. The forge deliberately did NOT port the isolation half because its layers are read-only and run no build; do not read that decision as permission to drop it here.  RE-RUN A TIMED-OUT LAYER ONCE, with its territory narrowed to specific functions rather than a whole diff -- that is what let a Sonnet hunter find story 3.3's one HIGH defect on the second round.  A TIMED-OUT LAYER IS A HOLE IN COVERAGE, NEVER A CLEAN RESULT: say so in the review summary and in deferred-work.md, record it in the findings table with zero findings, and never let its silence read as `found nothing`.",
  "REVIEW RUNS IN A FRESH CONTEXT — A PRECONDITION, NOT ADVICE (frostvein Epic 3; the forge already had the sibling rule for the PATCH pass). A review must NOT run in the session that did the dev. Measured on frostvein: story 3.3's review re-read 493k context per turn inheriting the dev session, against 3.2's 213k in its own — 2.3x, paid on EVERY turn, for a transcript it had no use for. Note this rule already existed there and was simply not followed, which is exactly why it is now stated as a precondition to check rather than a habit to encourage: if you are about to review work done earlier in THIS session, stop and say so instead of proceeding. ONE VERIFICATION PASS PER REVIEW, NOT ONE PER PATCH: re-gate turns are the highest cost-per-turn work in a review, so batch the patches and verify once. The stated risk is real and accepted — a later patch can break an earlier verified one — and what catches it is the final clean gate plus the full suite, not a re-gate after every individual fix.",
  "REVIEW FRAMING — unit-green is never feature-proof on this project. When reporting the outcome, state plainly what has and has NOT been proven by actually running it (the scenario test / TUI behavior the story promises), and never let passing gates imply the feature works end to end. An observable-outcome AC stays OPEN until it has actually been observed; say so in the summary rather than burying it.",
  "REVIEW LAYER CONFIGURATION -- SETTLED by Wolf on 2026-08-03 at story 2.2's review; do NOT re-ask it. Lever A is resolved: KEEP Blind Hunter + Edge Case Hunter on Sonnet; Acceptance Auditor, Feature Auditor and triage stay Opus. The binding addition: EVERY layer MUST RUN THE BINARIES, not merely read the diff. Each layer's prompt must carry the toolchain export AND ITS VERIFICATION -- `export PATH=\"$HOME/.cargo/bin:$PATH\"` followed by `cargo --version`, which the layer MUST run first and MUST report if it fails. Use `$HOME/.cargo/bin`: it is the RUSTUP SHIM dir, so it is version-agnostic and survives a toolchain bump, and it is exactly what `scripts/gate.sh` and `scripts/mutate.sh` already do -- follow that precedent, do not invent a third spelling. DO NOT use a mise path (`~/.local/share/mise/installs/rust/<ver>/bin`) and do not hardcode the rustup toolchain dir (`~/.rustup/toolchains/<ver>-<triple>/bin`): the first DOES NOT EXIST and the second dies on the next upgrade. WHY THE VERIFICATION LINE IS NOT OPTIONAL: this fact carried the nonexistent mise path from 2026-08-03 to 2026-08-08 and NOBODY NOTICED, because the export silently no-ops and the shim is already on PATH -- so every layer ran cargo fine while following a false instruction, which is this project's signature latent silent-failure shape. A layer that cannot run cargo must say so and be recorded as a COVERAGE HOLE, exactly as a timed-out layer is; it must never return findings-free silence that reads as a clean result. Also carry the `cargo test --offline -p <crate>` commands, and the live instruments (`cargo run -p simd`, `cargo run -p tui -- --frames 30`), plus instructions to put scratch work in /tmp, never modify a tracked file, and kill any daemon it starts. Rationale: across 1.3 and 2.1 model tier never discriminated -- the Sonnet hunters produced no unique finding and cost stayed flat -- while every finding of substance came from layers that executed code. Model tier is no longer the experiment; live execution is the standard. If a future retro revisits this, the control is still mutation kill-rate against 1.3's baseline. BUILD ISOLATION -- MANDATORY (Epic 3 retrospective, 2026-08-08; action item P2). Live execution stays, but it must not make the layers fight. Give EVERY layer its OWN build directory in its prompt -- `export CARGO_TARGET_DIR=/tmp/review-<layer>/target` -- so four concurrent layers each mandated to run cargo do not serialize on one target/ lock. WHY THIS REPLACED THE OLD ADVISORY: the previous text told each layer that target-lock contention was normal and not a defect, which trained them to sit through the exact starvation the time-box then read as a hang. Epic 3 killed three of four layers at 3.1 and three of four at 3.3 for this reason, and one killed layer's last words were `sequential due to target lock`. Cost of the fix: disk, plus a cold build per layer -- which now happen in PARALLEL instead of queueing. Still true and still worth telling each layer: the daemon's fixed port may be briefly held by a sibling agent, which is not a defect; bind a different port rather than concluding the daemon is broken. Also still forbidden: no layer runs `cargo clean` (it re-cools a shared cache) and no layer modifies a tracked file.",
  "LAYER TERRITORIES (R1) -- approved by Wolf 2026-08-08 (Epic 3 retrospective, action item P3), and read the caveat before defending it. THE SPLIT: Blind Hunter owns `crates/sim-core`. Edge Case Hunter owns the shells -- `crates/simd`, `crates/tui`, `crates/protocol`. Both OPUS auditors (Acceptance Auditor, Feature Auditor) keep WHOLE-DIFF scope and are not territorialised. Give each hunter only its territory's diff. SEQUENCING IS LOAD-BEARING: this rule is only safe once the LAYER TIME-BOX silence detector and the per-layer CARGO_TARGET_DIR are both in place. Narrowing a hunter's scope while layers are still dying would thin coverage that is already holed. If either of those is not yet encoded, do NOT apply this split. HONEST STATE OF THE EVIDENCE, recorded so nobody re-derives a stronger case than exists: R1 was proposed at the Epic 2 retrospective on CONVERGENCE -- the stale-speed trap (2.3) and duplicate dwarf ids (2.4) each found independently by three layers. Epic 3 was meant to measure that and could not, because the layers that would have converged were being killed. The ONE clean four-layer story of Epic 3 (3.2) produced 8 findings with exactly ONE convergence (AC10, acceptance + feature) -- 1-in-8, not 3-in-3. The Epic 3 retro RECOMMENDED closing R1 unapplied on that basis; Wolf took it anyway, and it is coherent because he took the reliability fixes in the same decision. REVERT RULE, carried verbatim from Epic 2: revert R1 (keep R2) if a defect is later found whose site sat inside a hunter's EXCLUDED territory. Control = mutation kill-rate against story 1.3's baseline. MEASURE = turns and cache-read tokens per review against Epic 3's baseline of 862 turns and $45.52 per story. HUMILITY CLAUSE, still standing from Epic 1: that retro predicted review $193 -> $39 and delivered a small INCREASE, so measure this on turns, and promise nothing in dollars.",
]
on_complete = "Two steps, in order. STEP A (METRIC): record this review session's token cost — the review is always YOUR (Claude/Opus) session, so unlike dev-story there is no delegated-skip branch; always record. Resolve STORY_KEY = basename (without .md) of the story file you reviewed, then run `python3 {project-root}/_bmad/scripts/session_tokens.py --phase review --story <STORY_KEY>`; show the breakdown and `est. cost`. Recording is delta-based, so this bills only the review work even when review shared a session with create/dev. (Post-review patches applied in a SEPARATE later session are recorded there with `--phase review-patch`.) STEP B (APPROVAL-GATED PUBLISH): after findings are triaged and patches handled per Wolf's choice: (1) summarize the review outcome and ASK Wolf whether to push and open the PR. (2) ONLY on his explicit yes: confirm cwd/remote = this repo (jeicei75/frostvein), push the feature branch, `gh pr create --base main` with a concise body, and report the PR URL. NOTE: the gh token may be scoped to Asgard-realm repos — if PR creation fails on auth, report it and give Wolf the compare URL instead; the push having succeeded is fine. (3) Wolf merges himself — NEVER merge, NEVER push without his explicit yes. If he is not happy or wants changes first, do not push; leave the local commit for a follow-up cycle. This gate applies however the review was triggered (chained from bmad-dev-story, or run standalone)."
