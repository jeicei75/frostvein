# frostvein overrides for bmad-code-review — Feature Auditor layer + metric + approval-gated publish.

[workflow]
persistent_facts = [
  "FOURTH REVIEW LAYER \u2014 Feature Auditor (\\\"does it do the thing?\\\"). In step 2, alongside Blind Hunter / Edge Case Hunter / Acceptance Auditor, ALWAYS run a Feature Auditor over the same diff + spec. Origin: on a sibling forge project, three adversarial layers found real data-loss defects and NONE noticed the feature did not work at all \u2014 the capability existed, was tested, and was never invoked; only the live run caught it, twice in two epics. All adversarial layers hunt for WRONG code; this one asks whether the RIGHT code is present. Method: (1) name the story's headline user-visible outcome in one sentence, in the user's words; (2) trace the ACTUAL end-to-end path that produces it \u2014 entry point -> each hop -> observable result \u2014 from real source, not the diff; (3) at every hop ask what INVOKES the next step: a capability that exists but is never called is THE defect this layer exists to catch; (4) flag what only a human running it would discover (a function registered but never instructed, a config the deployment never sets, a branch reachable only from tests); (5) state which ACs CANNOT be verified without actually running it (for frostvein: the scenario test or visible TUI behavior every story must end with) and say so rather than inferring them green. Output per hop: WIRED (cite the caller) or NOT WIRED (what is missing). A green suite is NOT evidence for this layer.",
  "REVIEW LAYER CONFIGURATION -- SETTLED by Wolf on 2026-08-03 at story 2.2's review; do NOT re-ask it. Lever A is resolved: KEEP Blind Hunter + Edge Case Hunter on Sonnet; Acceptance Auditor, Feature Auditor and triage stay Opus. The binding addition: EVERY layer MUST RUN THE BINARIES, not merely read the diff. Each layer's prompt must carry the toolchain export (export PATH=\"/home/vscode/.local/share/mise/installs/rust/1.97.1/bin:$PATH\" -- cargo is NOT on the agent PATH), the `cargo test --offline -p <crate>` commands, and the live instruments (`cargo run -p simd`, `cargo run -p tui -- --frames 30`), plus instructions to put scratch work in /tmp, never modify a tracked file, and kill any daemon it starts. Rationale: across 1.3 and 2.1 model tier never discriminated -- the Sonnet hunters produced no unique finding and cost stayed flat -- while every finding of substance came from layers that executed code. Model tier is no longer the experiment; live execution is the standard. If a future retro revisits this, the control is still mutation kill-rate against 1.3's baseline. BUILD ISOLATION -- MANDATORY (Epic 3 retrospective, 2026-08-08; action item P2). Live execution stays, but it must not make the layers fight. Give EVERY layer its OWN build directory in its prompt -- `export CARGO_TARGET_DIR=/tmp/review-<layer>/target` -- so four concurrent layers each mandated to run cargo do not serialize on one target/ lock. WHY THIS REPLACED THE OLD ADVISORY: the previous text told each layer that target-lock contention was normal and not a defect, which trained them to sit through the exact starvation the time-box then read as a hang. Epic 3 killed three of four layers at 3.1 and three of four at 3.3 for this reason, and one killed layer's last words were `sequential due to target lock`. Cost of the fix: disk, plus a cold build per layer -- which now happen in PARALLEL instead of queueing. Still true and still worth telling each layer: the daemon's fixed port may be briefly held by a sibling agent, which is not a defect; bind a different port rather than concluding the daemon is broken. Also still forbidden: no layer runs `cargo clean` (it re-cools a shared cache) and no layer modifies a tracked file.",
  "REVIEW FRAMING \u2014 unit-green is never feature-proof on this project. When reporting the outcome, state plainly what has and has NOT been proven by actually running it (the scenario test / TUI behavior the story promises), and never let passing gates imply the feature works end to end. An observable-outcome AC stays OPEN until it has actually been observed; say so in the summary rather than burying it.",
  "REVIEW-COST DISCIPLINE -- taken from the forge 2026-08-06 (its ep-11 retro A3), adapted to frostvein rather than copied. Review is this project's largest single cost: it was 75% of spend, is now 53%, and ~$22/story is the settled floor. It is expensive because it RE-READS, not because it thinks -- 96% of every token processed was a cache read, in BOTH epics -- and cost is turns x accumulated context, so a long review session is roughly quadratic. THREE RULES. (1) LABEL EVERY FINDING with its originating LAYER and a SEVERITY, in the triage, every time: HIGH (feature) / MED (edge+blind) / LOW (auditor). This is also the standing Epic 2 action item 'record which review layer raised each finding'. Convergence between layers was only visible at the Epic 2 retro because three layers happened to be named in two story files; the proposed R1 territory split rests entirely on this being MEASURED rather than inferred, and it is what makes 'which layer earns its keep?' answerable at the Epic 3 retro. Record a TIMED-OUT layer here too, as a coverage hole with zero findings -- never as a clean result (see LAYER TIME-BOX). (2) CAP THE LOW TAIL: a LOW finding goes STRAIGHT to _bmad-output/implementation-artifacts/deferred-work.md with its file:line -- no patch, no covering test, no re-gate. Patch only HIGH and MED, plus any LOW sitting in a function you are already editing. The LOW tail is what drives the most patch turns at the highest cost per turn. FROSTVEIN EXCEPTION, and it is not optional: a LOW that is a LATENT SILENT-FAILURE trap gets patched regardless of severity -- a wrong value that no test and no human will ever see (a broken observability instrument, a misreported error, a metric billed to the wrong transcript). This project has been bitten by that class repeatedly and Wolf has overridden 'defer it, YAGNI' every time it has come up. (3) FRESH CONTEXT IS MANDATORY, NOT ADVISORY (hardened at the Epic 3 retrospective, 2026-08-08; action item P5). The REVIEW itself must not run in the session that did the dev, and the PATCH pass must not run in the session that did the review. Hand each new session the diff plus the findings list, NEVER the previous transcript. MEASURED PRICE OF IGNORING THIS: story 3.3's review ran inside 3.3's dev session (same transcript, 2a9b9908) and re-read 493k of context PER TURN, against 3.2's 213k per turn in its own session -- 2.3x, paid on every turn, for carrying a dev transcript the review had no use for. This rule already existed and was simply not followed, which is why it is now phrased as a precondition: if the current session did the dev, STOP and start a new one before reviewing. Record each phase with its own --phase (review, review-patch) so the split stays visible in the ledger. (4) ONE VERIFICATION PASS PER REVIEW, NOT ONE PER PATCH (R2, approved 2026-08-08; action item P4). Apply all the patches a review calls for, THEN verify once: one `scripts/gate.sh` from a clean build plus one full `scripts/mutate.sh` run. Do not re-gate after each individual patch -- re-gate turns are the highest cost-per-turn work in a review. ACCEPTED RISK, stated so it is not rediscovered as a surprise: a later patch can break an earlier verified one, and the final gate and mutation run are what catch it. Both are mandatory and neither may be skipped or sampled. If the final pass goes red, do NOT bisect by re-gating each patch in turn -- read the failure.",
  "LAYER TIME-BOX -- MANDATORY, enforced by the orchestrator. REWRITTEN at the Epic 3 retrospective (2026-08-08, action item P1) because the previous wall-clock version was WRONG and cost real coverage: read this rule as a replacement, not a tightening. THE MEASURE IS SILENCE, NOT ELAPSED TIME. Kill a layer when it has gone 8 MINUTES without completing a NAMED step of its method and without emitting a finding. Wall-clock since launch is NOT the measure. Keep one absolute ceiling of 45 MINUTES so a layer that narrates progress forever still dies. WHY THE OLD RULE FAILED, and it is not a subtle failure: it killed on 20 minutes since launch, and a layer starved on the cargo target/ lock emits nothing -- which is indistinguishable from a hang. Epic 3 killed three of four layers at story 3.1 and three of four at story 3.3 (the Edge Case Hunter died silent in BOTH rounds, leaving that story's loader and boundary territory unreviewed by any layer). At 3.1 one of the killed layers was literally reporting the cause -- `sequential due to target lock` -- and the epic's single most severe defect (a whole-world designate taking a delta from 378 bytes to 16,761,209 bytes at 34.7 MB/s, with the world simultaneously unsaveable) was found by the orchestrator INLINE, after all three hunter layers had failed. The Epic 2 retrospective diagnosed this exactly and wrote the fix into no config file, so Epic 3 inherited the trap unchanged. PAIR IT WITH BUILD ISOLATION. P1 stops the wrong kills; the per-layer CARGO_TARGET_DIR in REVIEW LAYER CONFIGURATION removes the reason they happen. NEVER ship this detector without that isolation -- a better detector on top of real contention just waits longer before killing the same starved layer. BEFORE YOU KILL, ASK FOR WHAT IT HAS. A bare kill returns NOTHING, which is the opposite of this rule's stated purpose -- an unattended review must degrade into a PARTIAL REPORT, never into an open-ended wait and never into an empty one. So: message the layer `your box is up, start nothing new, report what you have NOW`, and kill only if it stays silent after that. At 3.3 this salvaged the Feature Auditor on the re-run, and it produced that review's best findings. A TIMED-OUT LAYER IS A HOLE IN COVERAGE, NEVER A CLEAN RESULT. Say so explicitly in the review summary and in deferred-work.md (`Edge Case Hunter timed out; its territory is unreviewed`), record it in the findings table with zero findings, and never let its silence be read as `found nothing`. A GROWING TRANSCRIPT IS NOT PROGRESS: a hung layer keeps emitting tokens and its log keeps growing, so file size, token count and `still running` all look identical to healthy work. The only signals that count are a NAMED step completed or a finding emitted. RE-RUN A TIMED-OUT LAYER ONCE, with its territory narrowed to specific functions rather than a whole diff -- that is what let a Sonnet hunter find story 3.3's one HIGH defect on the second round. Whole review ceiling: if total review wall-clock passes 90 MINUTES, stop, report what you have, and ask Wolf before continuing.",
  "LAYER TERRITORIES (R1) -- approved by Wolf 2026-08-08 (Epic 3 retrospective, action item P3), and read the caveat before defending it. THE SPLIT: Blind Hunter owns `crates/sim-core`. Edge Case Hunter owns the shells -- `crates/simd`, `crates/tui`, `crates/protocol`. Both OPUS auditors (Acceptance Auditor, Feature Auditor) keep WHOLE-DIFF scope and are not territorialised. Give each hunter only its territory's diff. SEQUENCING IS LOAD-BEARING: this rule is only safe once the LAYER TIME-BOX silence detector and the per-layer CARGO_TARGET_DIR are both in place. Narrowing a hunter's scope while layers are still dying would thin coverage that is already holed. If either of those is not yet encoded, do NOT apply this split. HONEST STATE OF THE EVIDENCE, recorded so nobody re-derives a stronger case than exists: R1 was proposed at the Epic 2 retrospective on CONVERGENCE -- the stale-speed trap (2.3) and duplicate dwarf ids (2.4) each found independently by three layers. Epic 3 was meant to measure that and could not, because the layers that would have converged were being killed. The ONE clean four-layer story of Epic 3 (3.2) produced 8 findings with exactly ONE convergence (AC10, acceptance + feature) -- 1-in-8, not 3-in-3. The Epic 3 retro RECOMMENDED closing R1 unapplied on that basis; Wolf took it anyway, and it is coherent because he took the reliability fixes in the same decision. REVERT RULE, carried verbatim from Epic 2: revert R1 (keep R2) if a defect is later found whose site sat inside a hunter's EXCLUDED territory. Control = mutation kill-rate against story 1.3's baseline. MEASURE = turns and cache-read tokens per review against Epic 3's baseline of 862 turns and $45.52 per story. HUMILITY CLAUSE, still standing from Epic 1: that retro predicted review $193 -> $39 and delivered a small INCREASE, so measure this on turns, and promise nothing in dollars.",
]
on_complete = "Two steps, in order. STEP A (METRIC): record this review session's token cost \u2014 always yours: `python3 {project-root}/_bmad/scripts/session_tokens.py --phase review --story <STORY_KEY>`; show the breakdown and `est. cost`. (Post-review patches applied in a SEPARATE later session are recorded there with `--phase review-patch`.) STEP B (APPROVAL-GATED PUBLISH): after findings are triaged and patches handled per Wolf's choice: (1) summarize the review outcome and ASK Wolf whether to push and open the PR. (2) ONLY on his explicit yes: confirm cwd/remote = this repo (jeicei75/frostvein), push the feature branch, `gh pr create --base main` with a concise body. NOTE: the gh token may be scoped to Asgard-realm repos \u2014 if PR creation fails on auth, report it and give Wolf the compare URL instead; the push having succeeded is fine. (3) Wolf merges himself \u2014 NEVER merge, NEVER push without his explicit yes."
