# frostvein overrides for bmad-create-story (ported from Nidavellir 2026-08-01; docs/ facts added).

[workflow]
persistent_facts = [
  "file:{project-root}/docs/project-brief.md",
  "file:{project-root}/docs/technical-preferences.md",
  "Epics are SHARDED under `{project-root}/_bmad-output/planning-artifacts/epics/`. To context a story, load ONLY that epic's self-contained shard `epics/ep-NN.md` (zero-padded \u2014 e.g. ep-01 -> `epics/ep-01.md`), which holds the epic objective + every story's user story, acceptance criteria, and source hints. Load `epics/requirements.md` ONLY when you need a specific FR/NFR definition, the Epic List, or the FR->epic coverage map. NEVER load all epic shards at once and never load the thin `epics.md` index for story content.",
  "STORY AUTHORING DISCIPLINE (overrides the base workflow's verbose/\"exhaustive\" framing \u2014 optimize for SIGNAL DENSITY, not volume). A story is a dev contract, not an essay: the dev agent must come away with every detail needed to implement flawlessly, and nothing it has to wade through to find them. ALWAYS PRESERVE (never trade away for brevity): exact file paths tagged NEW/UPDATE; full function/type signatures; the code skeleton when one clarifies the contract; the do-NOT scope boundaries; concrete acceptance criteria; the green-gate verification commands; the branch slug + commit attribution. CUT (these cause the bloat): (a) the same fact repeated across Acceptance Criteria + Tasks + Dev Notes \u2014 state it ONCE, in the most actionable place (usually a Task subtask); (b) per-bullet `[Source: ...]` citation tails \u2014 collect them into a single `### References` list and keep an inline cite only where that exact file:line is the thing to copy; (c) motivational/defensive prose (\"the whole point\", \"honors CLAUDE.md \u00a7X\", \"the #1 way to get this wrong\", \"ULTIMATE\", \"prevent disasters\") \u2014 state the rule plainly; (d) restating project-context.md or CLAUDE.md \u2014 reference them and include only the story-specific delta. SECTION BUDGET: Acceptance Criteria = one testable assertion each, <=2 sentences, imperative, no rationale inside the AC. Dev Notes keeps only \u2014 Scope guardrails (do-NOT list) \u00b7 What already exists (build on it, <=5 bullets) \u00b7 Helper/code skeleton if any \u00b7 Key decisions & traps (bold one-liners) \u00b7 Project Structure (files to touch) \u00b7 References; fold any testing/convention/security point into the relevant bullet rather than its own section. Previous-story intelligence = <=3 bullets, only deltas that change THIS story (pattern to follow, branch/merge dependency, a concrete gotcha), not a recap. One Change Log row (creation); leave the Dev Agent Record skeleton empty. TEST: if a line justifies rather than instructs, delete it; if removing a line would make the dev guess a path, signature, boundary, or command, keep it.",
  "SEAM-EXERCISED RULE (ep-02 retro A2 \u2014 born from the us-09 allowance dead-call, where Codex wired the gate's `check()` but discarded its decision, so the seam was present-but-inert). A SCAFFOLD/SEAM STORY is any story that places a decision-producing seam \u2014 a gate/policy/allowance, an audit/usage tap, a resolver/classifier, any injected Protocol \u2014 whose live caller may be deferred to a later story. For every such story you MUST author an explicit \"seam exercised\" acceptance criterion (and its test) that proves the seam's OUTPUT is CONSUMED, not merely produced or imported: assert the NEGATIVE/branch-changing path \u2014 e.g. seam returns deny -> the code short-circuits and the guarded action does NOT run; tap is wired -> a wire/emit is observed (or asserted-absent on the no-emit path); resolver returns X -> the caller routes to X. A test that only checks the seam was called, or that its return value is well-formed, does NOT satisfy this \u2014 the assertion must fail if the decision were discarded (the exact bug A2 prevents). If the seam genuinely has no live caller yet in THIS story (pure logic, wiring deferred), the AC still covers the seam's own decision surface AND a Deferred note names the future story that will wire it \u2014 so review can tell \"inert by design, decision-tested\" from \"silently dropped\".",
  "VERIFY CLAIMS AGAINST SOURCE (ep-03-us-04 \u2014 born from \"the runtime is not vendored / `.runtime/` absent\" riding unchecked from us-03's prose into us-04 and a user-facing explanation; the Hermes runtime was present and readable in `.runtime/` the whole time). When a prior story, deferred-work note, or project-context line asserts that something is ABSENT / UNCONFIRMED / INACCESSIBLE / CANNOT-BE-DONE (a missing runtime or dependency, an unconfirmed API or wire shape, an untestable path, a 'not present' file tree) and your new story will DEFER, STUB, MOCK, or scope-out work because of it \u2014 you MUST re-verify that claim against the actual source before inheriting it: read the named path (`rg --files`/`fd` for git-ignored-but-present trees like `.runtime/`, `projects/*`), or the pinned package, or run the discovery the prior spike would have. Cite what you found (file:line / commit) in the story. If the claim holds, keep the deferral and cite the proof; if it's stale/false, correct it \u2014 separate the still-valid DECISION (e.g. 'defer the binding') from a WRONG REASON (e.g. 'source absent' when it's really 'API not yet spiked'), and fix the reason. Distinguish 'not vendored' = not committed to git (may still be on disk) from 'not present'. Never let a second story's scope rest on an unverified absence.",
  "FROSTVEIN STORY SHAPE (binding, from docs/technical-preferences.md \u2014 restated because it overrides SM instinct): stories are VERTICAL slices (sim -> protocol -> TUI, or a headless scenario test), never horizontal layers; every story ends with something OBSERVABLE (a passing scenario test or visible TUI behavior); one story = one dev-agent session, split vertically if bigger; milestone 1 is 8-12 stories TOTAL \u2014 more is scope creep, cut don't plan. Anti-overengineering rules in that file are POLICY: no single-implementation abstractions, no config/plugin/event systems before a third concrete use, hardcoded constants are fine, deps need a one-sentence justification in the story.",
]
on_complete = "Record this story-creation session's token cost: run via Bash `python3 {project-root}/_bmad/scripts/session_tokens.py --phase create --story {{story_key}}` (substitute the resolved {{story_key}}). Show the printed breakdown, calling out the `est. cost` line. Measurement-only \u2014 do not modify the story or sprint-status."
