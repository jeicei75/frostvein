# frostvein overrides for bmad-create-story (ported from Nidavellir 2026-08-01; docs/ facts added).
# Reconciled with forge-process 1.1.0 on 2026-08-08: took the forge's executable-preflight
# PRINCIPLE as frostvein's verification-recipe rule (its Asgard mechanism is not ported).


[workflow]
persistent_facts = [
  "file:{project-root}/docs/project-brief.md",
  "file:{project-root}/docs/technical-preferences.md",
  "MODEL POLICY -- OPUS BY DEFAULT, OTHER MODELS WHEN THE WORK WARRANTS IT, AND ALWAYS RECORD WHICH ONE (Wolf, 2026-08-06, reconciling the forge's ep-11 retro A4 rather than taking it verbatim -- the forge's version framed non-Opus as a rationed exception, which is not this project's stance). Author stories on OPUS by default. Deviating is legitimate and expected on occasion -- a big, tricky or unusually open-ended design problem may genuinely warrant a different model -- so this is a DEFAULT, not a prohibition, and it is Wolf's call, not yours to assume. THE BINDING HALF IS THE RECORD, NOT THE CHOICE: whenever a phase runs on anything other than the default, put the EXACT model id in the story frontmatter as `model: <exact-id>  # <one-line reason>` -- the exact id (e.g. claude-opus-5), never a family nickname like 'Opus', because the nickname is what makes an old ledger row unreadable. THIS IS FOR LEARNING: session_tokens.py already captures the model set per phase, and the point is to be able to ask at a retrospective which model actually produced better work at what price. That question is unanswerable if the model is unlabelled, and it is the single largest lever the loop has -- the forge measured its alternative at exactly 2.0x Opus on every component (input, cache_write, cache_read, output), so an unexplained 2x in the ledger looks identical to a process regression. NEVER switch models silently mid-epic: a phase row whose model differs from its neighbours with no frontmatter reason is exactly the ambiguity that made the forge's ep-11 ledger unreadable until it was re-priced by hand. NOTE THE MECHANISM IS NOT HERE: the session model comes from the Claude Code harness (~/.claude/settings.json `model`, or /model in-session), NOT from this file or any BMad config -- a running session keeps the model it started with, which is why a mid-epic flip does not take effect until the next story.",
  "Epics are NOT sharded in frostvein. `{project-root}/_bmad-output/planning-artifacts/epics.md` is a single ~400-line file and is the ONLY source of story content: it holds the FR/NFR inventory, the Epic List, the FR->epic coverage map, and every story's user story + acceptance criteria + inline `// NOTE:` decisions. Load it whole and read the target epic's section. (Corrected 2026-08-03: this slot previously carried Nidavellir's sharded-epics rule verbatim from the 2026-08-01 port, instructing agents to load `epics/ep-NN.md` and to NEVER read `epics.md` — following it literally means refusing to read the one file that has the acceptance criteria. There is no `epics/` directory here and never has been.)",
  "STORY AUTHORING DISCIPLINE (overrides the base workflow's verbose/\"exhaustive\" framing — optimize for SIGNAL DENSITY, not volume). A story is a dev contract, not an essay: the dev agent must come away with every detail needed to implement flawlessly, and nothing it has to wade through to find them. ALWAYS PRESERVE (never trade away for brevity): exact file paths tagged NEW/UPDATE; full function/type signatures; the code skeleton when one clarifies the contract; the do-NOT scope boundaries; concrete acceptance criteria; the green-gate verification commands; the branch slug + commit attribution. CUT (these cause the bloat): (a) the same fact repeated across Acceptance Criteria + Tasks + Dev Notes — state it ONCE, in the most actionable place (usually a Task subtask); (b) per-bullet `[Source: ...]` citation tails — collect them into a single `### References` list and keep an inline cite only where that exact file:line is the thing to copy; (c) motivational/defensive prose (\"the whole point\", \"honors CLAUDE.md §X\", \"the #1 way to get this wrong\", \"ULTIMATE\", \"prevent disasters\") — state the rule plainly; (d) restating project-context.md or CLAUDE.md — reference them and include only the story-specific delta. SECTION BUDGET: Acceptance Criteria = one testable assertion each, <=2 sentences, imperative, no rationale inside the AC. Dev Notes keeps only — Scope guardrails (do-NOT list) · What already exists (build on it, <=5 bullets) · Helper/code skeleton if any · Key decisions & traps (bold one-liners) · Project Structure (files to touch) · References; fold any testing/convention/security point into the relevant bullet rather than its own section. Previous-story intelligence = <=3 bullets, only deltas that change THIS story (pattern to follow, branch/merge dependency, a concrete gotcha), not a recap. One Change Log row (creation); leave the Dev Agent Record skeleton empty. TEST: if a line justifies rather than instructs, delete it; if removing a line would make the dev guess a path, signature, boundary, or command, keep it.",
  "SEAM-EXERCISED RULE (ep-02 retro A2 — born from the us-09 allowance dead-call, where Codex wired the gate's `check()` but discarded its decision, so the seam was present-but-inert). A SCAFFOLD/SEAM STORY is any story that places a decision-producing seam — a gate/policy/allowance, an audit/usage tap, a resolver/classifier, any injected Protocol — whose live caller may be deferred to a later story. For every such story you MUST author an explicit \"seam exercised\" acceptance criterion (and its test) that proves the seam's OUTPUT is CONSUMED, not merely produced or imported: assert the NEGATIVE/branch-changing path — e.g. seam returns deny -> the code short-circuits and the guarded action does NOT run; tap is wired -> a wire/emit is observed (or asserted-absent on the no-emit path); resolver returns X -> the caller routes to X. A test that only checks the seam was called, or that its return value is well-formed, does NOT satisfy this — the assertion must fail if the decision were discarded (the exact bug A2 prevents). If the seam genuinely has no live caller yet in THIS story (pure logic, wiring deferred), the AC still covers the seam's own decision surface AND a Deferred note names the future story that will wire it — so review can tell \"inert by design, decision-tested\" from \"silently dropped\".",
  "VERIFY CLAIMS AGAINST SOURCE (ep-03-us-04 — born from \"the runtime is not vendored / `.runtime/` absent\" riding unchecked from us-03's prose into us-04 and a user-facing explanation; the Hermes runtime was present and readable in `.runtime/` the whole time). When a prior story, deferred-work note, or project-context line asserts that something is ABSENT / UNCONFIRMED / INACCESSIBLE / CANNOT-BE-DONE (a missing runtime or dependency, an unconfirmed API or wire shape, an untestable path, a 'not present' file tree) and your new story will DEFER, STUB, MOCK, or scope-out work because of it — you MUST re-verify that claim against the actual source before inheriting it: read the named path (`rg --files`/`fd` for git-ignored-but-present trees like `.runtime/`, `projects/*`), or the pinned package, or run the discovery the prior spike would have. Cite what you found (file:line / commit) in the story. If the claim holds, keep the deferral and cite the proof; if it's stale/false, correct it — separate the still-valid DECISION (e.g. 'defer the binding') from a WRONG REASON (e.g. 'source absent' when it's really 'API not yet spiked'), and fix the reason. Distinguish 'not vendored' = not committed to git (may still be on disk) from 'not present'. Never let a second story's scope rest on an unverified absence.",
  "OBSERVABILITY INSTRUMENT RULE (Epic 1 retro, and the reason it exists is story 2.1). Every story MUST name, in an explicit TASK, the instrument a human uses to SEE its headline outcome with their own eyes -- not a test, an instrument: a CLI flag, a headless render mode, a log line, a wire dump. Name the exact command in the Verification block. This is separate from, and additional to, the story's tests: a green suite is not feature-proof, and this project has twice shipped a capability that was tested and never invoked. The concrete lesson: 1.3 shipped `tui --frame`, which looked like the instrument for 'the client shows live state' but returns BEFORE the reader thread is spawned, so it structurally could not show a climbing tick -- 2.1's AC10 therefore had no instrument at all and was closed only by a reviewer running the binaries by hand. `tui --frames N` (the real loop, N frames, exits) was then added AT REVIEW, which is the wrong end of the process. When judging a candidate instrument ask: does it exercise the SAME code path the user's outcome flows through, and would it visibly differ if that path broke? If an existing instrument already covers the outcome, say so in the task and cite it rather than inventing a second one. TESTED-INSTRUMENT ADDENDUM (story 2.2, 2026-08-03 -- naming the instrument turned out to be necessary but NOT sufficient). The task that names the instrument MUST also require a TEST OF THE INSTRUMENT ITSELF, driving the real binary, and that test needs a mutation like any other. Why: 2.2 named `tui --frames N` in a task exactly as this rule demands, and the instrument was broken in two independent ways that no test could see. (a) It recomputed the camera every frame, re-centring on entity 0, so a walking dwarf's glyph stayed pinned to screen centre while the terrain scrolled underneath -- it rendered MOTION AS STILLNESS, and the dev agent's live evidence for 'dwarves visibly move' was an artefact of the instrument rather than an observation of the sim. (b) This devpod sets NO_COLOR=1, crossterm then drops every colour sequence, and the capture said nothing about it -- so a colour capture containing zero colour information read as proof that the state colours worked. Both were found at REVIEW, by layers that ran the binaries, after the story was already marked done. THE RULE: an instrument is an EVIDENCE CHANNEL, and an untested evidence channel manufactures false evidence rather than merely missing true evidence -- which is strictly worse than having no instrument, because it is believed. So: the instrument task carries its own test asserting the instrument actually reflects the thing it claims to show (the observable CHANGES when the underlying state changes), and, where the signal can be silently suppressed by the environment, that the instrument SAYS SO rather than emitting a well-formed capture that proves nothing.",
  "THE VERIFICATION RECIPE MUST BE EXECUTED BEFORE THE STORY IS SAVED (Epic 3 retro action item P6, reconciled 2026-08-08 with the forge's EVERY LIVE-GATE STORY CARRIES AN EXECUTABLE PREFLIGHT BLOCK, ep-06 retro A2 -- same principle, different court). THE PRINCIPLE, which is the forge's and is right: PROSE PRECONDITIONS DO NOT COUNT AND NEVER DID. The forge's mechanism (a fenced [preflight] toml block executed by bifrost-client/preflight.sh, declaring court/skill_role/tools/credentials) is Asgard machinery and is deliberately NOT ported -- frostvein has no court, no Hermes and no deployed forge. FROSTVEIN'S FORM OF THE SAME RULE: the Verification section's recipe must be RUN, by you, during story-creation, and shown to produce NON-ZERO evidence of the thing it claims to demonstrate, before the story file is saved. Three rules. (1) RANGE-CHECK THE OUTPUT, never the exit code: a capture that prints zero of every glyph and exits 0 is indistinguishable from a broken feature -- EXIT 0 IS NOT A RESULT. (2) PIN WHAT IS WORLD- OR TIME-DEPENDENT: pass `tui --z N` rather than assuming an opening level, and never assume a camera position, a tick number or a dwarf's location; if the recipe cannot be made deterministic, say so in the recipe itself. (3) A RECIPE THAT CANNOT YET RUN (the feature does not exist at authoring time) must state the exact command and the exact non-zero observation the dev agent is required to produce, so the obligation is inherited rather than lost. WHY, and it is the same evidence class three epics running: story 3.2's documented recipe designated at the opening view level where the map is air, so it marked nothing and the feature read as broken; story 3.3's recipe assumed a fixed opening camera z, aimed into undug rock, captured zero of every glyph and exited 0 -- and a review layer reported the feature did not work. BASELINE FOR EPIC 4: zero irreproducible recipes. The AC-level check (CAN IT HAPPEN / OUTCOME NOT MECHANISM) already guards the AC; nothing guarded the recipe that proves it. (4) THE RECIPE OPENS WITH A DELIBERATE RED (forge ep-15 retro A2 / nidavellir issue #21, hand-merged here at forge-process 1.3.2 on 2026-08-31; the forge's framing absorbs its own ep-06-a3 and is right -- a runbook that has not been walked is not a runbook). Whatever instrument the recipe leans on -- a capture mode, a range-check script, a grep, a counter, a headless render -- the recipe must NAME THE CONDITION TO BREAK, THE EXACT EXPECTED FAILURE OUTPUT, AND THE RESTORE STEP, and that RED must be OBSERVED before any green from the same instrument is accepted as evidence. This is the negative half of rule (1): range-checking the output proves the instrument SAW something, breaking the thing on purpose proves the instrument would have SAID SO. Frostvein has paid for the gap directly -- THREE instruments in one session reported success while capturing nothing, and every one of them would have been caught by a control run on a clean tree followed by a deliberate break. A green from an instrument that has never been seen to fail is a habit, not evidence.",
  "AN AC STATES AN OBSERVABLE OUTCOME THAT CAN ACTUALLY OCCUR (ep-2 retro action item, 2026-08-05, merged with the forge's ep-11 A6 rule). Spec-text defects are frostvein's own recurring class with no mechanical guard -- FOUR in seven stories, all authored here in create-story, all caught downstream at review: 1.3's AC11 specified a 100x40 fallback that is unreachable; 2.1's AC2 had to be amended mid-review; 2.3 shipped TWO unmeetable ACs (AC9 demanded a speed change in the 'very next delta' when the command crosses TCP and lands on the second; AC2 contradicted itself about oversized lines). Baseline for Epic 3 is ZERO. TWO CHECKS ON EVERY AC YOU WRITE. (1) CAN IT HAPPEN? Trace the observation through the real code path before you write it -- if the AC names a delta, a frame, a fallback, a timing window or a prior story's contract, open the file and confirm the observation is reachable and the restatement is accurate. An AC that restates an earlier story's contract inaccurately is the same defect as one that is impossible. (2) OUTCOME, NOT MECHANISM: write what must be TRUE and OBSERVABLE when the story is done, and leave HOW to the implementation. THE TEST: if a different implementation achieved the same observable outcome, would it VIOLATE this AC? If yes you have specified a mechanism -- restate it as the outcome, or keep it and justify inline WHY the mechanism is load-bearing. LEGITIMATE mechanism ACs exist and must say so in the AC text: determinism invariants (the seeded stream, the fixed named hash, the `.chain()`ed schedule -- the mechanism IS the requirement because NFR3 is about reproducibility), byte-exact wire contracts (AD-6), architectural edges (AD-1's zero-I/O sim-core, `tui` has no `sim-core` edge), and 'extend the existing X rather than build a second one' (AD-12's one job market, 2.4's single assemble()). IF YOU PRESCRIBE A MECHANISM YOU HAVE TAKEN RESPONSIBILITY FOR IT WORKING -- verify it against the real source (`file:line`) before writing it into the AC; ep-11's `asyncio.to_thread` AC could not achieve its own stated intent, all four review layers found it, and the AC had to be amended mid-review. SIBLING FAILURE: an AC that PRESUMES a capability nobody built -- when an AC describes the boss doing something, name every capability that flow needs, including hop zero: how the actor DISCOVERS the capability exists (the hint bar, the key, the mode).",

  "EVERY AC THAT NAMES AN OBSERVABLE MUST CITE ITS EMITTER, OR MAKE EMITTING IT A TASK (forge ep-13 retro A1 / nidavellir issue #32, Wolf's decision D2; hand-merged here at forge-process 1.3.2 on 2026-08-31). The forge put this at CREATION rather than in the review layer on purpose: catching it at review means dev has already built against the AC, which is what happened three times for three there. THE CHECK: for every AC that names an observable -- a log line, a wire field, a delta, a rendered pixel, a printed range-check figure, an on-screen glyph -- locate the code that EMITS it and cite it as `file:line` in the story, OR make emitting it an explicit TASK in this same story. An AC whose observable does not yet exist is a task, not a surprise at gate time. THE SECOND HALF, which is the half frostvein keeps failing: the observable must also DISCRIMINATE. Ask BOTH questions per AC -- does the emitter exist, and would its output DIFFER between the fixed and the unfixed code? If the answer to the second is no, the AC needs a discriminating field and that field is a task. FROSTVEIN'S EVIDENCE: 10.1's literal-scraping constant guard stayed GREEN while the bench camera was rolled 110 degrees, because it read text that does not change when the maths does -- and a later review found three more of that exact shape, one a constant PINNED BY THE GUARD AND READ BY NOTHING. Sibling case: the sim accepts-and-discards silently, so an 'it appears in the world' AC observed only client-side discriminates nothing, and the AC must name the real daemon as judge. SCOPE, so this is not read as a restatement: it is NARROWER than the OBSERVABILITY INSTRUMENT RULE (one human-visible instrument per story, and a test of that instrument) and than CAN IT HAPPEN (reachability of the observation). This one is per-AC, and it is only about whether the emitter exists and whether its output MOVES when the code does. Check all three; do not merge them.",

  "FROSTVEIN STORY SHAPE (binding, from docs/technical-preferences.md — restated because it overrides SM instinct): stories are VERTICAL slices (sim -> protocol -> TUI, or a headless scenario test), never horizontal layers; every story ends with something OBSERVABLE (a passing scenario test or visible TUI behavior); one story = one dev-agent session, split vertically if bigger; milestone 1 is 8-12 stories TOTAL — more is scope creep, cut don't plan. Anti-overengineering rules in that file are POLICY: no single-implementation abstractions, no config/plugin/event systems before a third concrete use, hardcoded constants are fine, deps need a one-sentence justification in the story.",
]
on_complete = "Record this story-creation session's token cost: run via Bash `python3 {project-root}/_bmad/scripts/session_tokens.py --phase create --story {{story_key}}` (substitute the resolved {{story_key}}). Then show the user the printed breakdown, calling out the `est. cost` line as the benchmark. The script appends one row to _bmad-output/implementation-artifacts/metrics/{{story_key}}.md (creating it if absent). Measurement-only — do not modify the story or sprint-status. METRIC RULE (mark vs row): a window that belongs to a phase gets a ROW; only a window belonging to no phase at all gets `session_tokens.py --mark`, which advances the cursor without writing a row — a mark where a row was owed hides the spend instead of over-attributing it visibly."
