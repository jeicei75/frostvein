# frostvein overrides for bmad-create-story (ported from Nidavellir 2026-08-01; docs/ facts added).

[workflow]
persistent_facts = [
  "file:{project-root}/docs/project-brief.md",
  "file:{project-root}/docs/technical-preferences.md",
  "Epics are NOT sharded in frostvein. `{project-root}/_bmad-output/planning-artifacts/epics.md` is a single ~400-line file and is the ONLY source of story content: it holds the FR/NFR inventory, the Epic List, the FR->epic coverage map, and every story's user story + acceptance criteria + inline `// NOTE:` decisions. Load it whole and read the target epic's section. (Corrected 2026-08-03: this slot previously carried Nidavellir's sharded-epics rule verbatim from the 2026-08-01 port, instructing agents to load `epics/ep-NN.md` and to NEVER read `epics.md` \u2014 following it literally means refusing to read the one file that has the acceptance criteria. There is no `epics/` directory here and never has been.)",
  "STORY AUTHORING DISCIPLINE (overrides the base workflow's verbose/\"exhaustive\" framing \u2014 optimize for SIGNAL DENSITY, not volume). A story is a dev contract, not an essay: the dev agent must come away with every detail needed to implement flawlessly, and nothing it has to wade through to find them. ALWAYS PRESERVE (never trade away for brevity): exact file paths tagged NEW/UPDATE; full function/type signatures; the code skeleton when one clarifies the contract; the do-NOT scope boundaries; concrete acceptance criteria; the green-gate verification commands; the branch slug + commit attribution. CUT (these cause the bloat): (a) the same fact repeated across Acceptance Criteria + Tasks + Dev Notes \u2014 state it ONCE, in the most actionable place (usually a Task subtask); (b) per-bullet `[Source: ...]` citation tails \u2014 collect them into a single `### References` list and keep an inline cite only where that exact file:line is the thing to copy; (c) motivational/defensive prose (\"the whole point\", \"honors CLAUDE.md \u00a7X\", \"the #1 way to get this wrong\", \"ULTIMATE\", \"prevent disasters\") \u2014 state the rule plainly; (d) restating project-context.md or CLAUDE.md \u2014 reference them and include only the story-specific delta. SECTION BUDGET: Acceptance Criteria = one testable assertion each, <=2 sentences, imperative, no rationale inside the AC. Dev Notes keeps only \u2014 Scope guardrails (do-NOT list) \u00b7 What already exists (build on it, <=5 bullets) \u00b7 Helper/code skeleton if any \u00b7 Key decisions & traps (bold one-liners) \u00b7 Project Structure (files to touch) \u00b7 References; fold any testing/convention/security point into the relevant bullet rather than its own section. Previous-story intelligence = <=3 bullets, only deltas that change THIS story (pattern to follow, branch/merge dependency, a concrete gotcha), not a recap. One Change Log row (creation); leave the Dev Agent Record skeleton empty. TEST: if a line justifies rather than instructs, delete it; if removing a line would make the dev guess a path, signature, boundary, or command, keep it.",
  "SEAM-EXERCISED RULE (ep-02 retro A2 \u2014 born from the us-09 allowance dead-call, where Codex wired the gate's `check()` but discarded its decision, so the seam was present-but-inert). A SCAFFOLD/SEAM STORY is any story that places a decision-producing seam \u2014 a gate/policy/allowance, an audit/usage tap, a resolver/classifier, any injected Protocol \u2014 whose live caller may be deferred to a later story. For every such story you MUST author an explicit \"seam exercised\" acceptance criterion (and its test) that proves the seam's OUTPUT is CONSUMED, not merely produced or imported: assert the NEGATIVE/branch-changing path \u2014 e.g. seam returns deny -> the code short-circuits and the guarded action does NOT run; tap is wired -> a wire/emit is observed (or asserted-absent on the no-emit path); resolver returns X -> the caller routes to X. A test that only checks the seam was called, or that its return value is well-formed, does NOT satisfy this \u2014 the assertion must fail if the decision were discarded (the exact bug A2 prevents). If the seam genuinely has no live caller yet in THIS story (pure logic, wiring deferred), the AC still covers the seam's own decision surface AND a Deferred note names the future story that will wire it \u2014 so review can tell \"inert by design, decision-tested\" from \"silently dropped\".",
  "VERIFY CLAIMS AGAINST SOURCE (ep-03-us-04 \u2014 born from \"the runtime is not vendored / `.runtime/` absent\" riding unchecked from us-03's prose into us-04 and a user-facing explanation; the Hermes runtime was present and readable in `.runtime/` the whole time). When a prior story, deferred-work note, or project-context line asserts that something is ABSENT / UNCONFIRMED / INACCESSIBLE / CANNOT-BE-DONE (a missing runtime or dependency, an unconfirmed API or wire shape, an untestable path, a 'not present' file tree) and your new story will DEFER, STUB, MOCK, or scope-out work because of it \u2014 you MUST re-verify that claim against the actual source before inheriting it: read the named path (`rg --files`/`fd` for git-ignored-but-present trees like `.runtime/`, `projects/*`), or the pinned package, or run the discovery the prior spike would have. Cite what you found (file:line / commit) in the story. If the claim holds, keep the deferral and cite the proof; if it's stale/false, correct it \u2014 separate the still-valid DECISION (e.g. 'defer the binding') from a WRONG REASON (e.g. 'source absent' when it's really 'API not yet spiked'), and fix the reason. Distinguish 'not vendored' = not committed to git (may still be on disk) from 'not present'. Never let a second story's scope rest on an unverified absence.",
  "OBSERVABILITY INSTRUMENT RULE (Epic 1 retro, and the reason it exists is story 2.1). Every story MUST name, in an explicit TASK, the instrument a human uses to SEE its headline outcome with their own eyes -- not a test, an instrument: a CLI flag, a headless render mode, a log line, a wire dump. Name the exact command in the Verification block. This is separate from, and additional to, the story's tests: a green suite is not feature-proof, and this project has twice shipped a capability that was tested and never invoked. The concrete lesson: 1.3 shipped `tui --frame`, which looked like the instrument for 'the client shows live state' but returns BEFORE the reader thread is spawned, so it structurally could not show a climbing tick -- 2.1's AC10 therefore had no instrument at all and was closed only by a reviewer running the binaries by hand. `tui --frames N` (the real loop, N frames, exits) was then added AT REVIEW, which is the wrong end of the process. When judging a candidate instrument ask: does it exercise the SAME code path the user's outcome flows through, and would it visibly differ if that path broke? If an existing instrument already covers the outcome, say so in the task and cite it rather than inventing a second one. TESTED-INSTRUMENT ADDENDUM (story 2.2, 2026-08-03 -- naming the instrument turned out to be necessary but NOT sufficient). The task that names the instrument MUST also require a TEST OF THE INSTRUMENT ITSELF, driving the real binary, and that test needs a mutation like any other. Why: 2.2 named `tui --frames N` in a task exactly as this rule demands, and the instrument was broken in two independent ways that no test could see. (a) It recomputed the camera every frame, re-centring on entity 0, so a walking dwarf's glyph stayed pinned to screen centre while the terrain scrolled underneath -- it rendered MOTION AS STILLNESS, and the dev agent's live evidence for 'dwarves visibly move' was an artefact of the instrument rather than an observation of the sim. (b) This devpod sets NO_COLOR=1, crossterm then drops every colour sequence, and the capture said nothing about it -- so a colour capture containing zero colour information read as proof that the state colours worked. Both were found at REVIEW, by layers that ran the binaries, after the story was already marked done. THE RULE: an instrument is an EVIDENCE CHANNEL, and an untested evidence channel manufactures false evidence rather than merely missing true evidence -- which is strictly worse than having no instrument, because it is believed. So: the instrument task carries its own test asserting the instrument actually reflects the thing it claims to show (the observable CHANGES when the underlying state changes), and, where the signal can be silently suppressed by the environment, that the instrument SAYS SO rather than emitting a well-formed capture that proves nothing.",
  "AN AC STATES AN OBSERVABLE OUTCOME THAT CAN ACTUALLY OCCUR (ep-2 retro action item, 2026-08-05, merged with the forge's ep-11 A6 rule). Spec-text defects are frostvein's own recurring class with no mechanical guard -- FOUR in seven stories, all authored here in create-story, all caught downstream at review: 1.3's AC11 specified a 100x40 fallback that is unreachable; 2.1's AC2 had to be amended mid-review; 2.3 shipped TWO unmeetable ACs (AC9 demanded a speed change in the 'very next delta' when the command crosses TCP and lands on the second; AC2 contradicted itself about oversized lines). Baseline for Epic 3 is ZERO. TWO CHECKS ON EVERY AC YOU WRITE. (1) CAN IT HAPPEN? Trace the observation through the real code path before you write it -- if the AC names a delta, a frame, a fallback, a timing window or a prior story's contract, open the file and confirm the observation is reachable and the restatement is accurate. An AC that restates an earlier story's contract inaccurately is the same defect as one that is impossible. (2) OUTCOME, NOT MECHANISM: write what must be TRUE and OBSERVABLE when the story is done, and leave HOW to the implementation. THE TEST: if a different implementation achieved the same observable outcome, would it VIOLATE this AC? If yes you have specified a mechanism -- restate it as the outcome, or keep it and justify inline WHY the mechanism is load-bearing. LEGITIMATE mechanism ACs exist and must say so in the AC text: determinism invariants (the seeded stream, the fixed named hash, the `.chain()`ed schedule -- the mechanism IS the requirement because NFR3 is about reproducibility), byte-exact wire contracts (AD-6), architectural edges (AD-1's zero-I/O sim-core, `tui` has no `sim-core` edge), and 'extend the existing X rather than build a second one' (AD-12's one job market, 2.4's single assemble()). IF YOU PRESCRIBE A MECHANISM YOU HAVE TAKEN RESPONSIBILITY FOR IT WORKING -- verify it against the real source (`file:line`) before writing it into the AC; ep-11's `asyncio.to_thread` AC could not achieve its own stated intent, all four review layers found it, and the AC had to be amended mid-review. SIBLING FAILURE: an AC that PRESUMES a capability nobody built -- when an AC describes the boss doing something, name every capability that flow needs, including hop zero: how the actor DISCOVERS the capability exists (the hint bar, the key, the mode).",

  "FROSTVEIN STORY SHAPE (binding, from docs/technical-preferences.md \u2014 restated because it overrides SM instinct): stories are VERTICAL slices (sim -> protocol -> TUI, or a headless scenario test), never horizontal layers; every story ends with something OBSERVABLE (a passing scenario test or visible TUI behavior); one story = one dev-agent session, split vertically if bigger; milestone 1 is 8-12 stories TOTAL \u2014 more is scope creep, cut don't plan. Anti-overengineering rules in that file are POLICY: no single-implementation abstractions, no config/plugin/event systems before a third concrete use, hardcoded constants are fine, deps need a one-sentence justification in the story.",
]
on_complete = "Record this story-creation session's token cost: run via Bash `python3 {project-root}/_bmad/scripts/session_tokens.py --phase create --story {{story_key}}` (substitute the resolved {{story_key}}). Show the printed breakdown, calling out the `est. cost` line. Measurement-only \u2014 do not modify the story or sprint-status."
