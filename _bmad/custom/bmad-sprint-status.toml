# frostvein overrides for bmad-sprint-status — action items are GitHub issues on THIS repo.
#
# TEMPLATE under forge-process (taken at 1.3.2, 2026-08-31). The repo, the archive path and the
# cross-repo rule below are frostvein's; local difference from the forge's copy is adaptation,
# not drift.
#
# WHY: action items used to live in `sprint-status.yaml` under an `action_items:` block. Measured
# at the move, that block was 27,193 tokens — 48% of a 56.5k-token file — against ~330 tokens for
# a `gh issue list` of the live items. It was also where items went to rot: all twelve open ones
# dated from Epic 5 and were still open at Epic 10, invisible unless someone opened the file.
#
# One source per fact:
#   state     -> the GitHub issue, and nowhere else
#   reasoning -> action-items.md (prose archive; history wins there, state wins on the issue)
#   the board -> neither
#
# A mirror was rejected deliberately: it goes stale the moment Wolf closes an issue from his
# phone. The cost is a network + auth dependency in a workflow that used to read one file, and
# it is accepted on the condition below — it must FAIL LOUDLY.

[workflow]

activation_steps_prepend = [
  "Fetch the open action items from GitHub — they are NOT in sprint-status.yaml any more. Run: `gh issue list --label action-item --state open --json number,title,labels,assignees --limit 100`. Treat the result as the ONLY source of action-item state.",
  "If that command fails for ANY reason (no auth, no network, `gh` absent, repo unreachable), you MUST report `Open action items: could not reach GitHub — <the actual error>` in the summary and continue the rest of the workflow. NEVER fall back to a local file, NEVER infer the list from action-items.md, and NEVER report zero open action items on a failed fetch. A silent empty list is exactly the false green this arrangement exists to prevent.",
]

# NOTE: arrays APPEND to the base customize.toml, which already supplies the
# project-context glob. Do not repeat it here or it loads twice.
persistent_facts = [
  "`sprint-status.yaml` no longer contains an `action_items:` block. Its absence is CORRECT and is not a validation failure, a missing required field, or a file to repair. Do not re-add it, and do not warn about it. The file carries a comment block in its place naming where the items went; leave it there.",
  "Open action items are GitHub issues on `jeicei75/frostvein` labelled `action-item`. The issue is the only place their status lives. `_bmad-output/implementation-artifacts/action-items.md` is the prose archive of record — reasoning, evidence, measurements, closure notes, all 60 items verbatim — and is NOT a status mirror; never read status from it.",
  "Every action item carries a ROUTING label naming its vehicle: `route:skill-rule` (a persistent fact in a BMad skill override), `route:story` (real code with tests — author it as a story), `route:forge-process` (a manifest bump plus check/install/ack), or `route:undecided`. Surface `route:undecided` items as a RISK. Frostvein's own evidence for why routing is the half that matters: at the 2026-08-31 move, all twelve open items were Epic 5 items still open at Epic 10 — five epics of rot, on a board that showed them the whole time.",
  "When reporting open action items, show the issue number, title and routing label, e.g. `#49 M2-12 — decide the self-gate's future (route:undecided)`.",
  "BEFORE FILING A NEW ACTION ITEM AS AN ISSUE, RE-VERIFY IT AGAINST THE TREE. A stale entry does not merely lose work, it INVENTS it: of the twelve items migrated on 2026-08-31, three were already done and had simply never been struck (M2-6, M2-8, M2-9) and two were half-done with stale framing (M2-7's stamp had landed, M2-15's `--at-tick` had landed and its 'fold into Epic 8' aimed at a closed epic). Filing all twelve verbatim would have fabricated roughly three items of scope. Record the verification in the archive entry, with the `file:line` or command that settled it.",
  "Closing an action item from a frostvein PR DOES work — issues and PRs live in the same repo, so `Closes #N` in a PR body closes it on merge. (The forge's copy of this rule says the opposite, correctly, for ITS multi-repo layout; do not port that caveat here.) What still does not close itself is an item whose vehicle is a skill-rule edit rather than a merged PR — close those by hand, on the evidence, and say what settled it.",
]
