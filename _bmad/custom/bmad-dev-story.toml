# frostvein overrides for bmad-dev-story — delegated Codex/Völundr dev, cargo gates, offline-sandbox prep.

[workflow]
persistent_facts = [
  "file:{project-root}/docs/technical-preferences.md",
  "DELEGATED IMPLEMENTATION MODE (frostvein, ported from the Nidavellir/Asgard cadence 2026-08-01): when THIS skill (bmad-dev-story) runs, the implementation is performed by CODEX (V\u00f6lundr), not by you. You are ORCHESTRATOR + VERIFIER. PROTOCOL: (1) Run normal activation + story selection; set Status in-progress, stamp baseline_commit. (2) Do NOT implement yourself. Write a handoff prompt to a temp file: point Codex at the story file's absolute path; restate the story's do-NOT scope guardrails AND docs/technical-preferences.md's anti-overengineering policy; require TDD red->green; branch slug = story id verbatim; commit as V\u00f6lundr (--author=\\\"V\u00f6lundr <jeicei75@gmail.com>\\\") in THIS repo (/workspace/projects/frostvein \u2014 single repo, the project root IS the git repo); commit on every green, not one squash; review-gated = NO push/PR. (3) SANDBOX PREP (Codex has no network): run `cargo fetch` yourself BEFORE the handoff so `cargo build/test --offline` works in the sandbox; tell Codex to use `--offline` and to REPORT (not work around) anything that fails only because of the sandbox \u2014 it must NEVER change production code, delete/weaken a test, or hand-roll a replacement for a std primitive to make its sandbox green (recurring failure class; the workaround ships to an environment without the limitation). (4) Launch in the BACKGROUND via `scripts/codex-handoff.sh <prompt-file> <run-log> <last-msg>` \u2014 it pins CODEX_HOME=/workspace/.codex (without it Codex 401s but still exits 0). (5) When Codex exits, NEVER trust exit 0: grep the log for 401/auth errors; confirm claimed files exist; check git state (branch, V\u00f6lundr author, expected file list); independently re-run the FULL gate from docs/technical-preferences.md: `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`, `cargo test`. (6) Verify Codex updated the story file (checkboxes, Dev Agent Record, File List, Change Log, Status->review) and complete anything it did not. (7) If Codex is unavailable or auth fails, STOP and tell Wolf; offer direct implementation as a fallback, never silently.",
]
on_complete = "Two steps, in order. STEP A (METRIC): record the dev cost. If the story was DELEGATED to Codex (the default), YOU record it \u2014 run `python3 {project-root}/_bmad/scripts/session_tokens.py --tool codex --phase dev --story <STORY_KEY>` (Codex CANNOT self-record correctly; a session_tokens run inside codex exec bills the wrong transcript). If you implemented DIRECTLY, run it with `--phase dev` (default claude tool). Show the breakdown and the `est. cost` line. STEP B (CHAIN TO REVIEW): this project runs code review immediately after dev \u2014 it is the default next step, do NOT ask whether to review. Invoke bmad-code-review on this story's changes (spec = the story file; diff = its feature branch vs main). You (Claude) run the review \u2014 a different model than the Codex dev, which is the point."
