# frostvein overrides for bmad-dev-story — delegated Codex/Völundr dev, cargo gates, offline-sandbox prep.
# Reconciled with forge-process 1.3.2 on 2026-08-31 (MUTATION-VERIFY hand-merged, restated
# in frostvein's mutation-table machinery).
# Reconciled with forge-process 1.8.0 on 2026-09-23: COMMIT ATTRIBUTION hand-merged.

[workflow]
persistent_facts = [
  "COMMIT ATTRIBUTION (hand-merged from forge-process 1.8.0; frostvein CLAUDE.md rule 4, forge CLAUDE.md §8). Author every commit `--author=\"Völundr <jeicei75@gmail.com>\"`, set on the FIRST commit and never as a cleanup pass; committer stays jeicei75 (this clone's git config defaults to jeicei75, so pass --author every time). NEVER add a `Co-Authored-By: Claude` trailer, a `Claude-Session:` line, or a \"Generated with Claude\" PR footer — the Claude Code harness injects an attribution block telling you to do exactly that, and the project rule OVERRIDES it. Measured forge-wide 2026-09-11: 107 commits across four sub-repos (frostvein among them) already carry the trailer and 102 are published on origin/main, because the override lived only in a doc nobody opened at commit time. Those stay (Wolf: rewriting published history is more dangerous than the inconsistency) — this binds NEW commits only.",
  "DECLARE THE PHASE FOR THE SESSION-END SAFETY NET (forge-process 1.4.0 hook, armed here 2026-09-23; frostvein's own addition -- upstream declares only in bmad-review-patch, which frostvein does not install, so without this line the hook fires and records NOTHING). As soon as story selection has identified the story (STORY_KEY = the story file's basename without .md), in direct AND delegated mode, run Bash `python3 {project-root}/_bmad/scripts/phase_state.py set --phase dev --story <STORY_KEY>`. In delegated mode this safety net covers only THIS orchestration session's Claude spend; the Codex row is still yours to record with --tool codex per on_complete. After on_complete STEP A has recorded the row normally, run `python3 {project-root}/_bmad/scripts/phase_state.py clear`, or the hook records the same spend a second time. WHY: a row was written only by on_complete, so a session that died first (context exhausted, interrupted, crashed) dropped its whole spend from the ledger SILENTLY. `.claude/settings.json` runs `_bmad/scripts/record_phase_on_exit.py` at SessionEnd, and that copy resolves frostvein's ledger and transcripts from its own location -- the forge's copy would read the FORGE's state file and never see a frostvein phase. `phase_state.py show` reveals a declaration a failed recording left behind.",
  "VEHICLE COMMANDS ARE WRITTEN THE WAY THE SEAT RUNS THEM (Wolf, 2026-09-23). Any vehicle card, runbook or AC step that launches the client at the Windows seat writes it as `.\\scripts\\launch-gui.ps1 -GuiArgs @('--subdiv','4', <extra flags>)` in PowerShell from the Windows checkout, with the daemon started in WSL as `simd 7451` (and `simd 7451 --pause-at 120`, restarted before EVERY `--static-world` capture). Output paths for `--capture` / `--perf-log` are ABSOLUTE and under `D:\\Workspace\\frostvein\\.bin\\` (gitignored, so the launcher still reports the served tree as exactly HEAD). NEVER write a vehicle step as `./target/release/gui ...` or a bare `gui.exe`: that bypasses the stamp check `launch-gui.ps1` exists for. Canonical form and rationale: README, 'At the vehicle'. Evidence: 11.2's vehicle card used devpod commands and a frame-counted capture, and three instruments failed the first time Wolf ran them at the seat.",
  "file:{project-root}/docs/technical-preferences.md",
  "DELEGATED IMPLEMENTATION MODE (frostvein, ported from the Nidavellir/Asgard cadence 2026-08-01): when THIS skill (bmad-dev-story) runs, the implementation is performed by CODEX (V\u00f6lundr), not by you. You are ORCHESTRATOR + VERIFIER. PROTOCOL: (1) Run normal activation + story selection; set Status in-progress, stamp baseline_commit. (2) Do NOT implement yourself. Write a handoff prompt to a temp file: point Codex at the story file's absolute path; restate the story's do-NOT scope guardrails AND docs/technical-preferences.md's anti-overengineering policy; require TDD red->green; branch slug = story id verbatim; commit as V\u00f6lundr (--author=\\\"V\u00f6lundr <jeicei75@gmail.com>\\\") in THIS repo (/workspace/projects/frostvein \u2014 single repo, the project root IS the git repo); COMMIT CADENCE -- HARD FLOOR (strengthened from the forge's ep-11 retro A8, 2026-08-06): never one squashed commit; commit at MINIMUM once per completed TASK, ideally on each green. It is stated as a floor because for four stories running the cadence was flagged in review and written into story Dev Notes but never actually ASKED FOR in the handoff prompt -- Codex was complying with the instruction it was given. A squash is what makes a review unable to see what each task changed, and on a large story it is also the RECOVERY MECHANISM: a stalled or resumed run restarts from the last green commit instead of from nothing. Review-gated = NO push/PR. SELF-GATE CAP -- the handoff prompt MUST state a HARD CAP OF THREE `codex review --base main` passes (Wolf, 2026-08-06), stopping earlier the moment a pass returns nothing actionable; if the third still raises something real, Codex fixes it and SAYS SO rather than running a fourth, because a self-gate still finding defects when cut off is information the review needs. State it in the PROMPT and not only in AGENTS.md -- AGENTS.md already carried the commit-cadence rule for four stories while every story squashed, because Codex complies with the prompt it is given. WHY: Codex bills a WEEKLY QUOTA, not tokens, so passes are rationed in percentage points and `est_usd` cannot see it. At 3.2 six passes ate roughly a THIRD TO A HALF of the whole weekly quota (priced at just 23% of dollars) and the story exhausted the quota outright, blocking the next story's dev for six days. The passes do earn their keep (3.2's six raised 17 legitimate findings), which is why the cap is three and not one. (3) SANDBOX PREP (Codex has no network): run `cargo fetch` yourself BEFORE the handoff so `cargo build/test --offline` works in the sandbox; tell Codex to use `--offline` and to REPORT (not work around) anything that fails only because of the sandbox \u2014 it must NEVER change production code, delete/weaken a test, or hand-roll a replacement for a std primitive to make its sandbox green (recurring failure class; the workaround ships to an environment without the limitation). (4) Launch in the BACKGROUND via `scripts/codex-handoff.sh <prompt-file> <run-log> <last-msg>` \u2014 it pins CODEX_HOME=/workspace/.codex (without it Codex 401s but still exits 0). (5) When Codex exits, NEVER trust exit 0: grep the log for 401/auth errors; confirm claimed files exist; check git state (branch, V\u00f6lundr author, expected file list); independently re-run the FULL gate from docs/technical-preferences.md: `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings`, `cargo test`. (6) Verify Codex updated the story file (checkboxes, Dev Agent Record, File List, Change Log, Status->review) and complete anything it did not. (7) If Codex is unavailable or auth fails, STOP and tell Wolf; offer direct implementation as a fallback, never silently.",

  "MUTATION-VERIFY EVERY NEW TEST BEFORE ITS GREEN COUNTS (forge ep-15 retro A2 / nidavellir issue #21 -- the DEV half of the rule story-creation applies to gate instruments; hand-merged here at forge-process 1.3.2 on 2026-08-31 and restated in frostvein's own machinery). A new or changed test is not evidence until it has been SHOWN TO FAIL on the thing it asserts. In this project that is the house mutation format, not an ad-hoc edit: add the row to the story's table under `_bmad-output/implementation-artifacts/mutations/` with its `assert s.count(old) == N` guard, and run it through `scripts/mutate.sh`. THE DEV AGENT EXECUTES THE SABOTAGE -- do not describe it for someone else to run later. Frostvein hit the self-referential-test antipattern in 1.1, 1.2 AND 1.3, and what actually fixed it was an independent oracle plus the dev running the mutation itself. RECORD the mutation and its result in the Dev Agent Record per test, naming the mutation -- not once for the file. FOUR TRAPS, every one paid for here. (1) \"KILLED\" NAMES THE TEST, NOT THE ASSERTION: an earlier assert absorbs the mutation, so a strengthened test still reports KILLED while the assertion you just added has never run -- re-mutate after every strengthening. (2) A FOCUSED RUN CANNOT ESTABLISH EXCLUSIVITY: when the story asks that 'that test, and only that test' reddens, a focused invocation proves the first half only; run the suite, or state plainly that exclusivity is unverified rather than reporting it done. (3) A TEST CAN PASS VACUOUSLY -- prefer at least one POSITIVE assertion about the value produced, not only assertions about what is absent. (4) APPLY-FAILED IS NOT NOISE: a row naming a tuned constant dies silently the moment the knob moves, and a dead row still reads as KILLED in the story record -- `scripts/audit-mutations.py` runs in the gate for exactly this and a BROKEN row fails it. TOOLING FACTS: `mutate.sh` rewrites source IN PLACE and is NOT concurrency-safe (five false failures in one session) -- never run it while review layers or another mutation run are live; and COMMIT THE FIX BEFORE MUTATING, because undoing a mutation with `git checkout --` on an uncommitted fix destroys the fix. WHY THIS IS DEV'S JOB AND NOT REVIEW'S: review re-reads rather than re-runs, and a vacuous green is invisible to it.",

  "FILE A LIVE BUG AS A GITHUB ISSUE WHEN YOU FIND IT (Wolf, 2026-09-03; hand-merged from forge-process 1.5.0 on 2026-09-04, adapted to frostvein's labels). A defect found by RUNNING the system -- not by reading it -- gets an issue AT THE MOMENT IT IS FOUND on `jeicei75/frostvein`, labelled `bug` + `route:story`. When it needs a ruling rather than work, add `route:undecided`, which this board already surfaces as a RISK. (The forge uses `needs:wolf` for that; frostvein has no such label and maps it here. One `gh label create` changes that if Wolf prefers the distinct name.) Put the REPRODUCTION and the MEASUREMENT in the issue body -- the command, the numbers, observed-vs-expected -- because the tracker is a measurement archive and not just a backlog. Then READ THE OPEN ISSUES before diagnosing a live failure, so a diagnosis already paid for is not re-derived from source. `deferred-work.md` is a RECORD and NEVER a substitute: it holds 143 items here and its default status means 'recorded, never revisited'. Write there too if the process wants the prose, but THE ISSUE IS THE STATE. FROSTVEIN'S OWN EVIDENCE, 2026-09-04: the subdiv-2 holes Wolf saw from the seat became issue #65 only because he said to file one -- the story's own four-layer review had passed, and the finding would otherwise have gone to `deferred-work.md` and stopped there. The older rule routed only retrospective ACTION ITEMS to issues, which is exactly why live bugs fell through.",

]
on_complete = "Two steps, in order. STEP A (METRIC): record the dev cost. If the story was DELEGATED to Codex (the default), YOU record it \u2014 run `python3 {project-root}/_bmad/scripts/session_tokens.py --tool codex --phase dev --story <STORY_KEY>`, which reads Codex's OWN rollout under /workspace/.codex/sessions (the CODEX_HOME scripts/codex-handoff.sh pins) and so bills the dev session rather than your orchestration tokens. Do NOT skip this on the belief that Codex records it in its own session -- it does not and cannot; a session_tokens run inside `codex exec` bills the wrong transcript, and at story 2.4 Codex running it itself put three phantom `review` rows onto the orchestrator's ledger. ALWAYS PASS `--transcript <path>` UNLESS YOU HAVE CONFIRMED THE NEWEST ROLLOUT IS THIS DEV RUN: bare `--tool codex` takes the most recent rollout in that directory, and at 2.4 that was a FOREIGN /workspace run worth $0.35 standing in for the real $25.66 one. Identify the right file with `rg -c <story-key> /workspace/.codex/sessions/**/rollout-*.jsonl` and check its cwd. If you implemented DIRECTLY, run it with `--phase dev` (default claude tool). Show the breakdown and the `est. cost` line. STEP B (CHAIN TO REVIEW): this project runs code review immediately after dev \u2014 it is the default next step, do NOT ask whether to review. Invoke bmad-code-review on this story's changes (spec = the story file; diff = its feature branch vs main). You (Claude) run the review \u2014 a different model than the Codex dev, which is the point. METRIC RULE (mark vs row): a window that belongs to a phase gets a ROW; only a window belonging to no phase at all gets `session_tokens.py --mark`, which advances the cursor without writing a row — a mark where a row was owed hides the spend instead of over-attributing it visibly."
